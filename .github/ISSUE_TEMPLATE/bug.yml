name: Bug
description: Something in Galena doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a vault with…
        2. Click…
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Galena version
      description: "Run `npx galena --version`."
      placeholder: "0.2.5"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version and browser.
      placeholder: "macOS 15, Node 24.11, Chrome 142"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: If the bug involves an agent, which one and its version.
      placeholder: "Claude Code 2.1"
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Terminal output where Galena runs, the browser console, or screenshots.
